name: Report mensile PPT

on:
  schedule:
    # Dal 28 al 31 alle 16:00 UTC: il job procede solo nell'ultimo giorno del mese (ora di Roma)
    - cron: "0 16 28-31 * *"
  workflow_dispatch:
    inputs:
      llm_provider:
        description: "LOCAL = Claude Code con abbonamento, API_KEY = API Anthropic a consumo"
        type: choice
        options: [LOCAL, API_KEY]
        default: LOCAL
      month:
        description: "Mese da elaborare (YYYY-MM), vuoto = mese corrente solo se è l'ultimo giorno"
        required: false

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  report:
    # I cron partono su Actions solo se SCHEDULE_ON_ACTIONS=true (evita doppioni con la routine locale).
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SCHEDULE_ON_ACTIONS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installa Claude Code (modalità LOCAL)
        if: ${{ (inputs.llm_provider || vars.LLM_PROVIDER || 'LOCAL') != 'API_KEY' }}
        run: npm install -g @anthropic-ai/claude-code
      - run: npm run job:report
        env:
          DATA_REPO: ${{ github.repository }}
          DATA_BRANCH: ${{ vars.DATA_BRANCH || 'data' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Rome' }}
          REPORT_TEMPLATE: ${{ vars.REPORT_TEMPLATE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ inputs.llm_provider || vars.LLM_PROVIDER || 'LOCAL' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MONTH: ${{ inputs.month }}
