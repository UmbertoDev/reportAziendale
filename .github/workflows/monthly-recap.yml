name: Recap mensile

on:
  schedule:
    # Il 25 alle 07:00 UTC (09:00 a Roma in ora legale)
    - cron: "0 7 25 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Mese da elaborare (YYYY-MM), vuoto = mese corrente"
        required: false
      overwrite:
        description: "Rigenera anche i recap già presenti"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run job:recap
        env:
          DATA_REPO: ${{ github.repository }}
          DATA_BRANCH: ${{ vars.DATA_BRANCH || 'data' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Rome' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MONTH: ${{ inputs.month }}
          OVERWRITE: ${{ inputs.overwrite }}
